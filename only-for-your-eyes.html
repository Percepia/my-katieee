<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102f61">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Only for Your Eyes, Baby! ❤️</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html{min-height:100%;background:#061936}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:#fff4f7;
background:radial-gradient(circle at 20% 10%,#3979b9 0%,transparent 40%),linear-gradient(145deg,#081e42,#174a85 62%,#0b2a58);display:flex;justify-content:center;padding:70px 18px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(5,23,53,.80),rgba(12,43,83,.70)),url('katieee-bg.jpg') center 25%/cover no-repeat;opacity:.38}
main{width:min(620px,100%);position:relative;z-index:1}
.topnav{display:flex;justify-content:center;gap:20px;margin-bottom:38px;font:600 13px/1.4 system-ui,sans-serif}
.topnav a{color:#ffdce6;text-decoration:none;border-bottom:1px solid #dc9bb0;padding-bottom:4px}
.card{background:rgba(10,38,77,.77);border:1px solid rgba(255,233,241,.26);box-shadow:0 20px 75px rgba(1,13,35,.30);backdrop-filter:blur(16px);border-radius:26px;padding:clamp(26px,6vw,52px);text-align:center}
.eyebrow{font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#c9e2ff}
h1{font-size:clamp(2.3rem,8vw,4.4rem);line-height:1.08;font-weight:400;margin:12px 0 16px;letter-spacing:-.045em}
p{line-height:1.8;color:#eef6ff;font-size:1.07rem}
form{margin:26px auto 8px;max-width:370px}
label{display:block;text-align:left;font:600 13px/1.5 system-ui,sans-serif;margin:0 0 8px;color:#e1eeff}
input{width:100%;padding:15px 16px;border:1px solid rgba(255,240,245,.5);background:rgba(4,19,43,.42);color:#fff;border-radius:12px;font:16px system-ui,sans-serif;outline-offset:3px}
input:focus{outline:2px solid #ffd3df}
button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:15px 20px;background:#ffe4ec;color:#0d356a;font:700 15px system-ui,sans-serif;cursor:pointer}
button:hover{background:#fff}
button:disabled{opacity:.55;cursor:wait}
.error{min-height:23px;font:13px/1.6 system-ui,sans-serif;color:#ffe3ab;margin-top:13px}
.hint{margin-top:20px;color:#d3e7ff;font:12px/1.6 system-ui,sans-serif}
#secret{display:none;text-align:left}
#secret.open{display:block}
#gate.unlocked{display:none}
.letter h2{font-size:clamp(2.5rem,8vw,3.8rem);font-weight:400;margin:13px 0 26px}
.letter p{margin-bottom:19px}
.letter .ending{font-size:1.45rem;color:white}
.signature{text-align:right;color:#d3e7ff;font-size:1.4rem;font-style:italic;margin-top:30px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <nav class="topnav" aria-label="Site pages">
    <a href="index.html">Home ❤️</a>
    <a href="breakup.html">Our 46-hour chapter</a>
  </nav>
  <div class="card">
    <section id="gate">
      <div class="eyebrow">a little secret</div>
      <h1>Only for Your Eyes, Baby! ❤️</h1>
      <p>Some words are just for you. Enter the password to open your little corner.</p>
      <form id="unlockForm">
        <label for="secretPassword">Our secret password</label>
        <input id="secretPassword" type="password" autocomplete="off" required placeholder="Password">
        <button type="submit" id="unlockBtn">Open my letter ♡</button>
      </form>
      <div class="error" role="status" aria-live="polite" id="error"></div>
      <p class="hint">Only the person with the password can read this letter.</p>
    </section>
    <section id="secret" aria-live="polite"></section>
  </div>
</main>
<script>
(() => {
  const salt='Dntw9pDGxsBfM2N1LVebHg==';
  const iv='C3MEgey/YdHx+ATY';
  const ciphertext='wBvlwx8k+7kE9CYRFawBpkAc0l0G47x5dxZsUQeckdP/xDnE8LuZj0mXGpcbjhGZ060Cram6dpAI67GhEKxbaJtf2AnmvEPqTXFDiUmPEbQJxKEkuy25yLCv5JgknDFbpnmjynYZjDaAzdOyZLADg6XempNLfNpoJ1dAXMP3MgVaXu2bJjBfvaWI1UP6zsFDMm8Ruf1MGsoP2d5AlkgHfwX5Atz03XTeJxNVMIN1kCRbfs2sBkZfZHpqlLFLMPAMNa43rhvwF/z8NeZyIg8Z/ySuNGQGCh60t27CT8FG0iChjnywx7XHt52mMMtPSUbdn4lEWQRGJ1UjI4KQZlj/B9fry341yCfgg11EJPMQGFXv/QQNUrw6Z6trVehp9hop65S22uz0txGb7FuSsTDs+1qNvyEPz7v21Bff92SEa6a3VvVItl63B35ppzcA/XN8gGYahIq/5M1ZPyQVZ0UyMvTKoLG0jzNnvr7a7IqNxk6EBhS/Iph0koyyxP/NlRhaauYSqsevx/SLzdhOFgJSmj0IpxBmDjAvNUZ16BHk7QTy4zHH4iMNJTGOBJLLNpNsVv8xJPjV0E217NNft3oxuA5DWaVU7zMNyJwHbsLyNL7sdBaXbR44PdVjlu3hsoCThrxqXpZFVAkbB/Gw+CGAMrMV9MxVMzoyYWkigk0MTz+rypcNKJOrf9W4TaEbfMSjrR/2awFDV2WvTW2sL35yr7Sz3NLS0uJtEZc5eWJmXAg2OKy0Qbos7m7AXdDRBAjqwPkMXE8Mqs4Pi2YlsX21LXwezISYEex48WuMMW8pdm9pl54xfubi18980zvzGsrrHL3MG1zmkohkNRWDNlrQM9Yxg3bNSxo4miyWF9oouSVrh+j9+uertr/R4dOUn8QNLF8pa/b/8N3LK1G7rptFrnXW/6GQTDwkB5Y812uPxUyuSxbTBw4ytwZxWi5RuFDTWm5NUorsUbkFOZ3d2MywXC2e4+UjRM1gblYDh2r0D7ZyP9Y=';
  const iterations=250000;
  const form=document.getElementById('unlockForm');
  const input=document.getElementById('secretPassword');
  const button=document.getElementById('unlockBtn');
  const error=document.getElementById('error');
  const gate=document.getElementById('gate');
  const secret=document.getElementById('secret');
  function decode(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
  form.addEventListener('submit', async e => {
    e.preventDefault();
    error.textContent='';
    if(!window.crypto || !crypto.subtle){
      error.textContent='This browser cannot unlock the letter. Try the published HTTPS website.';
      return;
    }
    button.disabled=true;
    button.textContent='Opening...';
    try{
      const keyMaterial=await crypto.subtle.importKey(
        'raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']
      );
      const key=await crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:decode(salt),iterations,hash:'SHA-256'},
        keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']
      );
      const bytes=await crypto.subtle.decrypt(
        {name:'AES-GCM',iv:decode(iv)}, key,decode(ciphertext)
      );
      secret.innerHTML=new TextDecoder().decode(bytes);
      secret.classList.add('open');
      gate.classList.add('unlocked');
      input.value='';
    }catch{
      error.textContent="Not quite, baby. Try the password again. ❤️";
      input.select();
    }finally{
      button.disabled=false;
      button.textContent='Open my letter ♡';
    }
  });
})();
</script>
</body>
</html>
