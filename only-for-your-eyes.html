<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5a1026">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Only for Your Eyes, Baby! ❤️</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html{min-height:100%;background:#320915}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:#fff4f7;
background:radial-gradient(circle at 20% 10%,#922f52 0%,transparent 40%),linear-gradient(145deg,#410d20,#7c1e3d 62%,#521027);display:flex;justify-content:center;padding:70px 18px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(44,4,17,.80),rgba(59,7,25,.70)),url('katieee-bg.jpg') center 25%/cover no-repeat;opacity:.38}
main{width:min(620px,100%);position:relative;z-index:1}
.topnav{display:flex;justify-content:center;gap:20px;margin-bottom:38px;font:600 13px/1.4 system-ui,sans-serif}
.topnav a{color:#ffdce6;text-decoration:none;border-bottom:1px solid #dc9bb0;padding-bottom:4px}
.card{background:rgba(73,12,35,.73);border:1px solid rgba(255,233,241,.26);box-shadow:0 20px 75px rgba(21,2,9,.26);backdrop-filter:blur(16px);border-radius:26px;padding:clamp(26px,6vw,52px);text-align:center}
.eyebrow{font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ffd1de}
h1{font-size:clamp(2.3rem,8vw,4.4rem);line-height:1.08;font-weight:400;margin:12px 0 16px;letter-spacing:-.045em}
p{line-height:1.8;color:#ffedf2;font-size:1.07rem}
form{margin:26px auto 8px;max-width:370px}
label{display:block;text-align:left;font:600 13px/1.5 system-ui,sans-serif;margin:0 0 8px;color:#ffe2eb}
input{width:100%;padding:15px 16px;border:1px solid rgba(255,240,245,.5);background:rgba(16,3,8,.3);color:#fff;border-radius:12px;font:16px system-ui,sans-serif;outline-offset:3px}
input:focus{outline:2px solid #ffd3df}
button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:15px 20px;background:#ffe4ec;color:#501027;font:700 15px system-ui,sans-serif;cursor:pointer}
button:hover{background:#fff}
button:disabled{opacity:.55;cursor:wait}
.error{min-height:23px;font:13px/1.6 system-ui,sans-serif;color:#ffe3ab;margin-top:13px}
.hint{margin-top:20px;color:#efb8c9;font:12px/1.6 system-ui,sans-serif}
#secret{display:none;text-align:left}
#secret.open{display:block}
#gate.unlocked{display:none}
.letter h2{font-size:clamp(2.5rem,8vw,3.8rem);font-weight:400;margin:13px 0 26px}
.letter p{margin-bottom:19px}
.letter .ending{font-size:1.45rem;color:white}
.signature{text-align:right;color:#ffd4e0;font-size:1.4rem;font-style:italic;margin-top:30px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <nav class="topnav" aria-label="Site pages">
    <a href="index.html">Home ❤️</a>
    <a href="breakup.html">Our 46-hour chapter</a>
  </nav>
  <div class="card">
    <section id="gate">
      <div class="eyebrow">a little secret</div>
      <h1>Only for Your Eyes, Baby! ❤️</h1>
      <p>Some words are just for you. Enter the password to open your little corner.</p>
      <form id="unlockForm">
        <label for="secretPassword">Our secret password</label>
        <input id="secretPassword" type="password" autocomplete="off" required placeholder="Password">
        <button type="submit" id="unlockBtn">Open my letter ♡</button>
      </form>
      <div class="error" role="status" aria-live="polite" id="error"></div>
      <p class="hint">Only the person with the password can read this letter.</p>
    </section>
    <section id="secret" aria-live="polite"></section>
  </div>
</main>
<script>
(() => {
  const salt='ddP+9Tmrnsdu93U09ktMAQ==';
  const iv='uoFOvi05ouUj0WB9';
  const ciphertext='Vp1XbA4FAXwdjhq+dUpkQyKH4zhx29MZSEAkkRgo4julT3AG/XGFefdFerm8NfTDLc040ppnCAtWG/pl8aO6I1lXHqdqBrN2qopFn8VqyYpCPIivnQnsqpXmVu3gV4Qz5MKRIosqvOpaw4pcKBPHH0vFH1Fa84F/681CMGXMWAUNppRJ8O4CZ3iUP1yXMMEbZcNXSqK8TkwE9jF8Jir8Hvbb4a4S95LRNx2/7vgORxrtm+oIbAEmPjuS82klqRZQTg/cVtudY/5+ArxaD5yfQ7HpUElMSyIkYdtTv8JCUmBvFEcPWx+RQocGtPetu5whw8/LSbqNU/AC/+1z45bf92e99b3IAvlDY3BnEpa5HlgHsu/oR2scBFMTZ7/zhks/VrWNIqwIgT79haPov7PMrOv+KXHs/vIuA2ldChIRNjJgg7CgV4y9QLWJzvl+8ThoYY90XQ17549DVR0mY12FWpBosHTvzxHH1EvKNlwpsRtZfP/pgqEh1MOvTrBlD/36A2dbwGmc1UR/fIvtcFvCmJWZ0v1xIva3Ezypitl9rIY6z9hpQUmXD7PxkA21RpdC4or6bfAAQWldSRemeHsfbgzv2f+fe87b0MGfJ3ALCkFS3XBzFJPfJdghN9syts/NHqU5LZNYMk5OqePhkYpWzcYam8y6I3h8ZxbOr8FpKRQqN756QGrOIm5mU/GEZzQvSdSZoB3EwNMhmsYDQmqqnk1Z7zwM8krmb6+kiSOEIYhQWLa3DXByS5MhKv0uZS6EvgWouSnqzTG8LlJNLt0bhw84L70oLDagt5oi+MZXFSgUhf+O9dyCSFO/hU6Tq2O8qm/9wdWEDwfDO0ry1YQPCSMcbYcE425FXFwRYVHnxtCL1wry39PzJGkrlN+TQhERy3oCCJXMU3AL+A7o2M9t+s/ImezAmlTPMwRxOPvbWamONa+QvwLe+Pzel5jrdngcwkvLKrgJcnaJ1kQPieYU/FtYhWtY1gyBT491Csl2UDw=';
  const iterations=250000;
  const form=document.getElementById('unlockForm');
  const input=document.getElementById('secretPassword');
  const button=document.getElementById('unlockBtn');
  const error=document.getElementById('error');
  const gate=document.getElementById('gate');
  const secret=document.getElementById('secret');
  function decode(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
  form.addEventListener('submit', async e => {
    e.preventDefault();
    error.textContent='';
    if(!window.crypto || !crypto.subtle){
      error.textContent='This browser cannot unlock the letter. Try the published HTTPS website.';
      return;
    }
    button.disabled=true;
    button.textContent='Opening...';
    try{
      const keyMaterial=await crypto.subtle.importKey(
        'raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']
      );
      const key=await crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:decode(salt),iterations,hash:'SHA-256'},
        keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']
      );
      const bytes=await crypto.subtle.decrypt(
        {name:'AES-GCM',iv:decode(iv)}, key,decode(ciphertext)
      );
      secret.innerHTML=new TextDecoder().decode(bytes);
      secret.classList.add('open');
      gate.classList.add('unlocked');
      input.value='';
    }catch{
      error.textContent="Not quite, baby. Try the password again. ❤️";
      input.select();
    }finally{
      button.disabled=false;
      button.textContent='Open my letter ♡';
    }
  });
})();
</script>
</body>
</html>
