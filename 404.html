<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8f1f3a" />
  <title>Wrong page. Right girl. ❤️</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root{
      --bg1:#4d0719;
      --bg2:#7d1531;
      --bg3:#b0284b;
      --line:rgba(255,220,228,.18);
      --text:#fff7fa;
      --soft:#ffd7e2;
      --gold:#ffd7a8;
      --shadow:rgba(39,4,16,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Georgia, "Times New Roman", serif;color:var(--text)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at 18% 10%, rgba(255,255,255,.08), transparent 24%),
        radial-gradient(circle at 80% 18%, rgba(255,180,200,.08), transparent 20%),
        linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
      overflow:hidden;
    }
    .card{
      width:min(620px,100%);
      text-align:center;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      border:1px solid var(--line);
      border-radius:32px;
      box-shadow:0 28px 72px var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding:42px 24px;
    }
    .tiny{
      font-family:"Segoe UI",system-ui,sans-serif;
      text-transform:uppercase;
      letter-spacing:.2em;
      color:var(--soft);
      font-size:.78rem;
      margin-bottom:12px;
    }
    h1{
      margin:0;
      font-size:clamp(2.6rem,10vw,4.4rem);
      line-height:.96;
      color:#fff7fa;
    }
    p{
      max-width:470px;
      margin:18px auto 0;
      line-height:1.85;
      font-size:1.06rem;
      color:#fff2f5;
    }
    a{
      display:inline-block;
      margin-top:24px;
      text-decoration:none;
      background:linear-gradient(135deg, #ff84aa, #ff6f98);
      color:white;
      padding:14px 22px;
      border-radius:999px;
      font-weight:700;
      box-shadow:0 14px 28px rgba(61,4,23,.2);
    }
    .heart{
      margin-top:18px;
      color:var(--gold);
      letter-spacing:.35em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="tiny">oops</div>
    <h1>Wrong page.<br>Right girl. ❤️</h1>
    <p>
      Looks like this page wandered off. But the important part is still true:
      this whole little place was made for Katieee.
    </p>
    <a href="/">Take me back home</a>
    <div class="heart">💖 💗 💖</div>
  </main>
</body>
</html>
